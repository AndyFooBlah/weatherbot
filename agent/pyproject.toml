[project]
name = "weatherbot-agent"
version = "0.1.0"
description = "ADK agent that answers questions about my Ambient Weather data."
requires-python = ">=3.11"
dependencies = [
  "google-adk[toolbox]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weatherbot_agent"]
