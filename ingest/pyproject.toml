[project]
name = "weatherbot-ingest"
version = "0.1.0"
description = "Pull observations from Ambient Weather Network into Cloud SQL Postgres."
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "google-cloud-secret-manager>=2.20",
  "cloud-sql-python-connector>=1.20",
  "pg8000>=1.31",
  "typer>=0.12",
  # Gmail API for the daily outage report (weatherbot outage-report --send)
  "google-api-python-client>=2.120",
  "google-auth>=2.30",
]

[project.scripts]
weatherbot = "weatherbot_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weatherbot_ingest"]
